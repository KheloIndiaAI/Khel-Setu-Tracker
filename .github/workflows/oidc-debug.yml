# TEMPORARY - delete this file once the IAM trust policy is set to the real `sub`.
# Prints the claims of the GitHub OIDC token (never the token itself) to the job summary.
name: OIDC debug (temporary)
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  show-sub:
    runs-on: ubuntu-24.04
    steps:
      - name: Print OIDC claims
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          p=$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#p} % 4 )) -ne 0 ]; do p="${p}="; done
          {
            echo '### OIDC token claims'
            echo '```json'
            printf '%s' "$p" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref, job_workflow_ref}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
